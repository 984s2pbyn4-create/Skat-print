<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>СКАТ: Печать и PDF</title>
    <style>
        :root {
            --bg: #0f1412; --panel: #1a211d; --ink: #e2efe6; --mute: #93a99b; 
            --signal: #5cff9d; --line: #2b322e; --ease: cubic-bezier(0.23, 1, 0.32, 1);
        }
        body { margin: 0; background: var(--bg); color: var(--ink); font-family: -apple-system, sans-serif; -webkit-user-select: none; user-select: none; padding-bottom: 40px; }
        .container { max-width: 800px; margin: 0 auto; padding: 16px; }
        h1 { font-size: 24px; text-align: center; color: var(--signal); margin-bottom: 20px; }
        
        .tabs { display: flex; gap: 8px; margin-bottom: 16px; }
        .tabs button { flex: 1; padding: 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; color: var(--ink); font-weight: 600; }
        .tabs button.active { background: var(--signal); color: #03140a; border-color: var(--signal); }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 16px; margin-bottom: 16px; }
        label { display: block; font-size: 13px; color: var(--mute); margin-bottom: 8px; }
        input, textarea, select { width: 100%; box-sizing: border-box; background: rgba(0,0,0,0.2); border: 1px solid var(--line); color: var(--ink); border-radius: 8px; padding: 10px; font-size: 16px; margin-top: 4px; font-family: inherit; }
        input:focus, textarea:focus { outline: none; border-color: var(--signal); }
        button { padding: 12px; border: none; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; transition: 0.2s var(--ease); display: flex; align-items: center; justify-content: center; gap: 6px; width: 100%; margin-top: 8px; }
        button:active { transform: scale(0.97); }
        .btn-primary { background: var(--signal); color: #03140a; }
        .btn-ghost { background: transparent; border: 1px solid var(--line); color: var(--ink); }
        .hint { font-size: 12px; color: var(--mute); line-height: 1.4; margin-top: 8px; }
    </style>
    <!-- pdf-lib для работы с PDF -->
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
</head>
<body>

<div class="container">
    <h1>СКАТ: Печать</h1>

    <div class="tabs">
        <button class="active" onclick="switchTab('pdf')">PDF-инструменты</button>
        <button onclick="switchTab('img')">Печать JPG</button>
    </div>

    <!-- Вкладка PDF -->
    <div id="tab-pdf" class="tab-content active">
        <div class="card">
            <h3>1. Загрузите PDF</h3>
            <input type="file" id="pdfFile" accept="application/pdf">
        </div>
        <div class="card">
            <h3>2. Настройки печати</h3>
            <label>Страницы (например: 1, 3, 5-7)
                <input type="text" id="pageRange" placeholder="1-3, 5">
            </label>
            <label>Ориентация
                <select id="orientation">
                    <option value="auto">Как в файле</option>
                    <option value="portrait">Книжная</option>
                    <option value="landscape">Альбомная</option>
                </select>
            </label>
            <label>Масштабирование
                <select id="scaling">
                    <option value="fit">Вписать в страницу</option>
                    <option value="none">Оригинальный размер</option>
                </select>
            </label>
        </div>
        <button class="btn-primary" onclick="processAndPrintPDF()">🖨 Подготовить и открыть печать</button>
        <p class="hint">Будет создан новый PDF только с выбранными страницами и нужной ориентацией. Откроется системное окно AirPrint.</p>
    </div>

    <!-- Вкладка JPG (упрощённая) -->
    <div id="tab-img" class="tab-content">
        <div class="card">
            <h3>Печать картинки</h3>
            <input type="file" id="imgFile" accept="image/*">
            <button class="btn-primary" onclick="printImage()">🖨 Открыть печать</button>
        </div>
    </div>
</div>

<script>
    function switchTab(tabId) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.tabs button').forEach(el => el.classList.remove('active'));
        document.getElementById('tab-' + tabId).classList.add('active');
        event.target.classList.add('active');
    }

    // Разбор строки страниц "1, 3, 5-7" в массив индексов (0-based)
    function parsePages(input, total) {
        const pages = [];
        if (!input.trim()) {
            // Если пусто — все страницы
            for (let i = 0; i < total; i++) pages.push(i);
            return pages;
        }
        input.split(',').forEach(part => {
            part = part.trim();
            if (part.includes('-')) {
                const [start, end] = part.split('-').map(Number);
                for (let i = start; i <= end; i++) {
                    if (i >= 1 && i <= total) pages.push(i - 1);
                }
            } else {
                const num = parseInt(part);
                if (num >= 1 && num <= total) pages.push(num - 1);
            }
        });
        return [...new Set(pages)].sort((a, b) => a - b); // Убираем дубли и сортируем
    }

    async function processAndPrintPDF() {
        const fileInput = document.getElementById('pdfFile');
        if (!fileInput.files.length) {
            alert('Сначала выберите PDF-файл');
            return;
        }

        const file = fileInput.files[0];
        const arrayBuffer = await file.arrayBuffer();
        
        try {
            const { PDFDocument, degrees, PageSizes } = PDFLib;
            const srcPdf = await PDFDocument.load(arrayBuffer);
            const totalPages = srcPdf.getPageCount();

            const pageInput = document.getElementById('pageRange').value;
            const indices = parsePages(pageInput, totalPages);
            
            if (indices.length === 0) {
                alert('Не выбрано ни одной страницы (проверьте номера)');
                return;
            }

            const newPdf = await PDFDocument.create();
            const copiedPages = await newPdf.copyPages(srcPdf, indices);
            
            const orientation = document.getElementById('orientation').value;
            const scaling = document.getElementById('scaling').value;

            for (let i = 0; i < copiedPages.length; i++) {
                const page = copiedPages[i];
                const { width, height } = page.getSize();

                // Ориентация
                if (orientation === 'portrait') {
                    // Книжная: ширина < высота
                    if (width > height) {
                        page.setRotation(degrees(90)); // Поворачиваем на 90
                    }
                } else if (orientation === 'landscape') {
                    // Альбомная: ширина > высота
                    if (height > width) {
                        page.setRotation(degrees(90));
                    }
                }

                // Масштабирование (простое: если fit, можно потом добавить, но pdf-lib не масштабирует контент страницы легко, только размер)
                // Для простоты оставляем как есть, pdf-lib не меняет внутренний масштаб контента при setSize.
                // Реальное "вписать" требует перерисовки контента, что сложно. Оставим оригинальный размер страницы.
                
                newPdf.addPage(page);
            }

            const pdfBytes = await newPdf.save();
            const blob = new Blob([pdfBytes], { type: 'application/pdf' });
            const url = URL.createObjectURL(blob);

            // Открываем в новой вкладке и печатаем
            const win = window.open(url, '_blank');
            // Safari на iOS требует жеста пользователя для print(), но мы уже в обработчике клика.
            // Дадим небольшую задержку, чтобы PDF успел загрузиться.
            setTimeout(() => {
                try {
                    win.print();
                } catch (e) {
                    console.log('Не удалось вызвать печать автоматически, пользователь может нажать кнопку Поделиться -> Печать');
                }
            }, 1500);

        } catch (err) {
            console.error(err);
            alert('Ошибка обработки PDF: ' + err.message);
        }
    }

    function printImage() {
        const input = document.getElementById('imgFile');
        if (!input.files.length) {
            alert('Выберите картинку');
            return;
        }
        const url = URL.createObjectURL(input.files[0]);
        const win = window.open(url, '_blank');
        setTimeout(() => {
            try { win.print(); } catch (e) {}
        }, 1000);
    }
</script>
</body>
</html>
